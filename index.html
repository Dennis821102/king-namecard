<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>分享名片 - 依燃軟體</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --cream: #FFF6EC;
      --card: #FFFFFF;
      --band: #8E3A10;
      --band-sub: #F3D3BE;
      --orange: #FC9000;
      --rust: #CC4B12;
      --ink: #3D2317;
      --ink-dim: #8A7365;
      --hair: #E7CFBB;
    }

    body {
      font-family: "PingFang TC", "Noto Sans TC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--cream);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 18px 40px;
    }

    .card {
      width: 100%;
      max-width: 340px;
      background: var(--card);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(140, 80, 40, 0.14);
    }

    /* 半身照 + 左上角 logo */
    .photo { position: relative; line-height: 0; }
    .photo > img.shot { width: 100%; display: block; }
    .photo > img.logo {
      position: absolute;
      top: 14px; left: 14px;
      width: 112px;
    }

    /* 姓名色帶 */
    .band {
      background: var(--band);
      color: #fff;
      padding: 16px 18px 18px;
    }
    .band .name {
      font-size: 25px; font-weight: 700; letter-spacing: 0.06em;
    }
    .band .name em { font-style: normal; font-weight: 400; font-size: 20px; margin-left: 8px; }
    .band .role {
      margin-top: 6px;
      font-size: 13px; color: var(--band-sub); letter-spacing: 0.03em;
    }

    /* 按鈕 */
    .actions {
      width: 100%; max-width: 340px;
      margin-top: 14px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 15px 16px;
      background: var(--card);
      border: 1px solid var(--hair);
      border-radius: 12px;
      color: var(--ink);
      font-size: 15px; font-weight: 600; letter-spacing: 0.04em;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(140, 80, 40, 0.06);
      transition: border-color .18s, background .18s, color .18s;
    }
    .btn:hover { border-color: var(--orange); color: var(--rust); }
    .btn-share {
      border-color: var(--orange);
      color: var(--rust);
      font-weight: 700;
    }
    .btn-share:hover { background: #FFF1E0; }
    .btn-share:disabled {
      background: #F3EDE7; border-color: #E4DAD1; color: #A79C93;
      cursor: not-allowed; box-shadow: none;
    }

    .status {
      max-width: 340px; width: 100%;
      margin-top: 12px;
      font-size: 13px; color: var(--ink-dim); text-align: center; min-height: 20px;
    }
    .status.error { color: #C0392B; }
    .status.success { color: #2E7D32; }

    .foot {
      margin-top: 20px;
      font-size: 10px; letter-spacing: 0.3em; color: #C0AA99; text-indent: 0.3em;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="photo">
      <img class="shot" src="img/portrait.jpg" alt="周袁德 King">
      <img class="logo" src="everan-logo-text.png" alt="EVERAN 依燃軟體有限公司">
    </div>
    <div class="band">
      <div class="name">周袁德<em>King</em></div>
      <div class="role">創辦人 Founder ／ 依燃軟體</div>
    </div>
  </div>

  <div class="actions">
    <a class="btn" href="tel:0910544606"><span>立即致電</span>📞</a>
    <a class="btn" href="https://line.me/ti/p/~at821010" target="_blank" rel="noopener"><span>立即加 LINE 聊</span>💬</a>
    <button class="btn btn-share" id="btnShare" disabled>載入中...</button>
  </div>

  <div class="status" id="status"></div>
  <div class="foot">EVERAN SOFTWARE</div>

  <script>
    // =============================================
    // 請將下方 LIFF_ID 替換為你的 LIFF ID
    // =============================================
    const LIFF_ID = '2010175345-eDPVQtSp';

    // Flex Message 的圖片必須是 https 絕對網址
    const BASE = 'https://dennis821102.github.io/king-namecard';

    const LINKS = {
      tel:   'tel:0910544606',
      line:  'https://line.me/ti/p/~at821010',
      web:   'https://everan-sw.com/',
      liff:  'https://liff.line.me/' + LIFF_ID
    };

    const BAND = '#8E3A10';
    const CREAM = '#FFF6EC';
    const RUST = '#CC4B12';
    const ORANGE = '#FC9000';
    const INK = '#3D2317';
    const HAIR = '#E7CFBB';

    // 白底描邊按鈕（Flex 的 button 元件不能設邊框，改用可點擊的 box）
    function btn(label, uri) {
      return {
        type: 'box',
        layout: 'vertical',
        backgroundColor: '#FFFFFF',
        borderColor: HAIR,
        borderWidth: '1px',
        cornerRadius: '10px',
        paddingAll: '13px',
        action: { type: 'uri', label: label, uri: uri },
        contents: [
          { type: 'text', text: label, size: 'sm', weight: 'bold', color: INK, align: 'center' }
        ]
      };
    }

    function bullet(text) {
      return {
        type: 'box',
        layout: 'baseline',
        spacing: 'sm',
        contents: [
          { type: 'text', text: '●', size: 'xxs', color: ORANGE, flex: 1 },
          { type: 'text', text: text, size: 'sm', color: INK, flex: 12, wrap: true }
        ]
      };
    }

    // ---------- 第一張：半身照名片 ----------
    const bubbleProfile = {
      type: 'bubble',
      size: 'mega',
      styles: {
        hero: { backgroundColor: '#FFFFFF' },
        body: { backgroundColor: BAND },
        footer: { backgroundColor: CREAM }
      },
      hero: {
        type: 'box',
        layout: 'vertical',
        paddingAll: '0px',
        contents: [
          {
            type: 'image',
            url: BASE + '/img/portrait.jpg',
            size: 'full',
            aspectRatio: '1:1',
            aspectMode: 'cover'
          },
          {
            type: 'box',
            layout: 'vertical',
            position: 'absolute',
            offsetTop: '14px',
            offsetStart: '14px',
            width: '104px',
            contents: [
              { type: 'image', url: BASE + '/everan-logo-text.png', size: 'full', aspectRatio: '739:567', aspectMode: 'fit' }
            ]
          }
        ]
      },
      body: {
        type: 'box',
        layout: 'vertical',
        backgroundColor: BAND,
        paddingAll: '18px',
        spacing: 'xs',
        contents: [
          {
            type: 'box',
            layout: 'baseline',
            spacing: 'sm',
            contents: [
              { type: 'text', text: '周袁德', size: 'xl', weight: 'bold', color: '#FFFFFF', flex: 0 },
              { type: 'text', text: 'King', size: 'md', color: '#FFFFFF', flex: 0 }
            ]
          },
          { type: 'text', text: '創辦人 Founder ／ 依燃軟體', size: 'xs', color: '#F3D3BE', margin: 'sm' }
        ]
      },
      footer: {
        type: 'box',
        layout: 'vertical',
        backgroundColor: CREAM,
        spacing: 'sm',
        paddingAll: '14px',
        contents: [
          btn('立即致電', LINKS.tel),
          btn('立即加 LINE 聊', LINKS.line),
          btn('分享我的電子名片', LINKS.liff)
        ]
      }
    };

    // ---------- 第二張：品牌與服務 ----------
    const bubbleBrand = {
      type: 'bubble',
      size: 'mega',
      styles: {
        body: { backgroundColor: CREAM },
        footer: { backgroundColor: CREAM }
      },
      hero: {
        type: 'image',
        url: BASE + '/img/brand-hero.jpg',
        size: 'full',
        aspectRatio: '20:13',
        aspectMode: 'cover'
      },
      body: {
        type: 'box',
        layout: 'vertical',
        backgroundColor: CREAM,
        paddingAll: '20px',
        spacing: 'sm',
        contents: [
          { type: 'text', text: '「說得出來的流程', size: 'lg', weight: 'bold', color: RUST, align: 'center', wrap: true },
          { type: 'text', text: '就做得出來的系統」', size: 'lg', weight: 'bold', color: RUST, align: 'center', wrap: true },
          { type: 'text', text: '為你量身打造　把繁瑣的問題交給系統', size: 'xs', color: '#8A7365', align: 'center', margin: 'md', wrap: true },
          { type: 'separator', color: HAIR, margin: 'lg' },
          {
            type: 'box',
            layout: 'vertical',
            margin: 'lg',
            spacing: 'sm',
            contents: [
              bullet('網站設計與整合'),
              bullet('預約排程＋雲端櫃台'),
              bullet('POS 收單帳務＋掃碼點餐'),
              bullet('客製化軟體開發')
            ]
          }
        ]
      },
      footer: {
        type: 'box',
        layout: 'vertical',
        backgroundColor: CREAM,
        spacing: 'sm',
        paddingAll: '14px',
        contents: [
          btn('依燃軟體官網', LINKS.web),
          btn('加 LINE 諮詢', LINKS.line),
          btn('立即致電', LINKS.tel)
        ]
      }
    };

    const flexMessage = {
      type: 'flex',
      altText: '周袁德 King - 依燃軟體 名片',
      contents: {
        type: 'carousel',
        contents: [bubbleProfile, bubbleBrand]
      }
    };

    // ---------- LIFF ----------
    const btnShare = document.getElementById('btnShare');
    const statusEl = document.getElementById('status');

    function setStatus(msg, type) {
      statusEl.textContent = msg || '';
      statusEl.className = 'status' + (type ? ' ' + type : '');
    }

    async function main() {
      try {
        if (!LIFF_ID || LIFF_ID.includes('YOUR_LIFF')) {
          setStatus('請先設定 LIFF ID', 'error');
          btnShare.textContent = '尚未設定 LIFF ID';
          return;
        }

        setStatus('正在初始化 LIFF...');
        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          setStatus('請先登入 LINE');
          liff.login();
          return;
        }

        if (!liff.isApiAvailable('shareTargetPicker')) {
          setStatus('此環境不支援分享功能，請在 LINE App 內開啟', 'error');
          btnShare.textContent = '請在 LINE 中開啟';
          return;
        }

        btnShare.disabled = false;
        btnShare.textContent = '分享我的電子名片';
        setStatus('');
      } catch (err) {
        setStatus('LIFF 初始化失敗: ' + err.message, 'error');
        btnShare.textContent = '初始化失敗';
      }
    }

    btnShare.addEventListener('click', async () => {
      try {
        btnShare.disabled = true;
        setStatus('開啟分享清單...');
        const result = await liff.shareTargetPicker([flexMessage]);
        if (result) {
          setStatus('名片已送出', 'success');
        } else {
          setStatus('已取消分享');
        }
      } catch (err) {
        setStatus('分享失敗: ' + err.message, 'error');
      } finally {
        btnShare.disabled = false;
        btnShare.textContent = '分享我的電子名片';
      }
    });

    main();
  </script>
</body>
</html>
